name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install uv (for skills-ref validate)
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install

      - name: make check
        run: make check

  # The Dockerfile ships the VM run mode (plan "Run anywhere"). An image that
  # only builds when someone remembers to try it by hand rots the first time
  # a base-image tag or a pinned tool version moves — this is the check that
  # keeps it honest (Rule 0: an unwired check did not ship).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: software-factory:ci
