name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The example repository is cloned beside this one, because the checks that
      # read it assert its shape. Without it they skip, and a skipped check is not
      # a passing one.
      - uses: actions/checkout@v5
        with:
          repository: learnwithparam/agent-run-ledger
          path: ledger-checkout

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - name: Put the example where the checks look for it
        run: mv ledger-checkout ../ledger && (cd ../ledger && bun install)

      - run: make check
      - run: make prove
      - run: make score
